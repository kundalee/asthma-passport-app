  --alert: #F08A70; --alert-soft: #35211C; --alert-line: #5A3328;

  --note: #B7A8EC; --note-soft: #262238; color-scheme: dark; } }
:root[data-theme="dark"] {

* { box-sizing: border-box; }

button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 56px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 400; letter-spacing: .02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .brand-sub { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.back { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: -8px; border: 0; background: transparent; border-radius: 50%; cursor: pointer; }

.sos { border-radius: var(--r); background: var(--alert-soft); border: 1px solid var(--alert-line); overflow: hidden; }

.sos-list { list-style: none; margin: 0; padding: 0 8px 8px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; min-height: 128px; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); cursor: pointer; }

.rows button:hover { background: var(--accent-soft); }
.rows .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rows .tt { font-weight: 500; line-height: 1.5; }
.rows .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.rows .chev { color: var(--muted); flex: none; }
.cat-head { display: flex; gap: 12px; align-items: center; }
.cat-head svg { width: 40px; height: 40px; color: var(--accent); flex: none; }
.cat-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.3; }
.cat-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* badges */
.badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 1.7; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.age7 { background: var(--warn-soft); color: var(--warn); }
.badge.rx { background: var(--note-soft); color: var(--note); }
.badge.cat { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.badge.flag { background: var(--note-soft); color: var(--note); }

/* card detail */
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card-title { margin: 6px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.35; }
.answer { padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); font-size: 17px; font-weight: 500; line-height: 1.65; }
.answer .k { display: block; font-size: 12px; font-weight: 500; letter-spacing: .12em; color: var(--accent); margin-bottom: 2px; }
.urgent .answer { background: var(--alert-soft); }
.urgent .answer .k { color: var(--alert); }
.tdesc { margin: 0 0 10px; font-size: 15px; }
.drugnote { margin: 10px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.blk h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 10px; }
ol.steps > li { counter-increment: st; position: relative; padding-left: 38px; }
ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.urgent ol.steps > li::before { background: var(--alert); color: var(--surface); }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.6; }
.tbl th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }

.tbl td:first-child { font-weight: 500; min-width: 6.5em; }
.tbl tr.z-good td:first-child { color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.tbl tr.z-warn td:first-child { color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.tbl tr.z-alert td:first-child { color: var(--alert); box-shadow: inset 4px 0 0 var(--alert); }
.tbl td.ck { text-align: center; color: var(--accent); font-weight: 700; }
.drugs { display: flex; flex-direction: column; gap: 10px; }
.drug { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); }

.callout { padding: 12px 14px; border-radius: var(--r); font-size: 15px; }
.callout .k { display: block; font-size: 12px; letter-spacing: .12em; font-weight: 500; margin-bottom: 2px; }
.callout.tip { background: var(--surface); border: 1px solid var(--line); }

.callout.caution .k { color: var(--warn); }
.callout.se { background: var(--surface); border: 1px solid var(--line); }
.callout.se .k { color: var(--muted); }
.callout.when { background: var(--alert-soft); border: 1px solid var(--alert-line); }
.callout.when .k { color: var(--alert); }
.callout.when .num { display: block; margin-top: 6px; font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }
.callout.note { background: var(--note-soft); border: 1px dashed color-mix(in srgb, var(--note) 50%, transparent); }

.vids { display: flex; flex-direction: column; gap: 8px; }
.vid { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); }
.vid .ph { width: 64px; aspect-ratio: 16/10; border-radius: 8px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); flex: none; }
.vid .ph svg { width: 22px; height: 22px; }
.vid .tx { min-width: 0; flex: 1; }
.vid .tt { font-weight: 500; font-size: 15px; line-height: 1.5; }
.vid .langs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.vid .langs span { font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.rel { display: flex; flex-direction: column; gap: 8px; }
.rel button { text-align: left; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); cursor: pointer; font-size: 15px; }
.rel button:hover { border-color: var(--accent); }
.rel .id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.src { font-size: 12.5px; color: var(--muted); }

.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-weight: 400; font-size: 18px; margin-bottom: 4px; }
.hint { font-size: 13px; color: var(--muted); margin: -8px 0 0; }
mark { background: color-mix(in srgb, var(--warn) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

footer.foot { padding: 20px 16px 28px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--ink); font-size: 14px; }
.toggle input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--raised); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--note); }
.toggle input:checked::after { transform: translateX(16px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } .tile { min-height: 0; } }
</style>

    var cat = catById[id];
    var list = CARDS.filter(function (c) { return c.cat === id; });
    setBar(cat.name, '');
    view.innerHTML = '<div class="cat-head">' + ICONS[id] + '<div><h2>' + esc(cat.name) + '</h2><p>' + esc(cat.sub) + '・' + list.length + ' 張知識卡</p></div></div>' +
      '<ul class="rows">' + list.map(function (c) { return rowHTML(c, false); }).join('') + '</ul>';
  }

  /* ---------- card ---------- */
  function stepsHTML(s) {
    return '<ol class="steps">' + s.map(function (x) {
      if (Array.isArray(x)) return '<li>' + hl(x[0]) + '<ul>' + x[1].map(function (y) { return '<li>' + hl(y) + '</li>'; }).join('') + '</ul></li>';
      return '<li>' + hl(x) + '</li>';
    }).join('') + '</ol>';
  }
  function tableHTML(t) {
    var z = t.zones || [];
    return '<div class="tbl"><table><thead><tr>' + t.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      t.rows.map(function (r, i) {
        var cls = z[i] ? ' class="z-' + z[i] + '"' : '';
        return '<tr' + cls + '>' + r.map(function (cell, j) {
          var ck = (cell === '✓') ? ' class="ck"' : '';
          return '<td' + ck + '>' + (cell === '' ? '<span class="src">—</span>' : hl(cell)) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  function callout(cls, k, body) { return '<div class="callout ' + cls + '"><span class="k">' + k + '</span>' + body + '</div>'; }

  function renderCard(c) {
    var cat = catById[c.cat];
    setBar(cat.name, c.cat === 'A' ? '' : 'cat-' + c.cat);
    var h = '<article class="' + (c.urgent ? 'urgent' : '') + '" style="display:flex;flex-direction:column;gap:18px">';
    h += '<div><div class="card-meta"><span class="badge cat">' + esc(c.id) + '・' + esc(cat.name) + '</span>' + ageBadge(c) + '</div>' +
      '<h2 class="card-title">' + hl(c.t) + '</h2></div>';
    h += '<div class="answer"><span class="k">簡單說</span>' + hl(c.a) + '</div>';
    if (c.table) h += '<div class="blk">' + tableHTML(c.table) + '</div>';
    if (c.tables) h += c.tables.map(function (t) { return '<div class="blk"><h3>' + esc(t.title) + '</h3>' + (t.desc ? '<p class="tdesc">' + hl(t.desc) + '</p>' : '') + tableHTML(t) + '</div>'; }).join('');
    if (c.s) h += '<div class="blk"><h3>' + esc(c.sh || (c.drugs ? '說明' : '該怎麼做')) + '</h3>' + stepsHTML(c.s) + '</div>';
    if (c.drugs) {
      h += '<div class="blk"><h3>常見藥品</h3><div class="drugs">' + c.drugs.map(function (d) {
        return '<div class="drug"><div class="zh">' + hl(d.zh) + '</div><div class="en">' + hl(d.en) + '</div>' +
          (d.info.length ? '<ul>' + d.info.map(function (i) { return '<li>' + hl(i) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      }).join('') + '</div>' + (c.med ? '<p class="drugnote">藥品依全國氣喘用藥許可證清單（2026 年 4 月）整理。部分藥品只核准用於青少年或成人，孩子適合用哪一種，請依醫師處方。</p>' : '') + '</div>';
    }
    if (c.vids) {
      h += '<div class="blk"><h3>教學影片</h3><div class="vids">' + c.vids.map(function (v) {
        return '<div class="vid"><div class="ph">' + ICONS.play + '</div><div class="tx"><div class="tt">' + esc(v[0]) + '</div><div class="langs"><span>台語</span><span>國語</span><span>英文</span></div></div></div>';
      }).join('') + '</div></div>';
    }
    if (c.video) {
      h += '<div class="vid"><div class="ph">' + ICONS.play + '</div><div class="tx"><div class="tt">看教學影片（影片連結待提供）</div><div class="langs"><span>台語</span><span>國語</span><span>英文</span></div></div></div>';
    }
    if (c.se) h += callout('se', '可能的副作用', hl(c.se));
    if (c.caution) h += callout('caution', '注意', hl(c.caution));
    if (c.tip) h += callout('tip', '小提醒', hl(c.tip));
    if (c.w || c.urgent) {
      h += callout('when', c.urgent ? '要立刻就醫的情況' : '什麼時候要找醫師',
        (c.w ? hl(c.w) : '有危險徵象時，請立刻到急診。') + (c.urgent ? '<span class="num">' + '緊急時請撥打 119，或立即到最近的急診。</span>' : ''));
    }
    var srcs = [];
    if (c.pg) srcs.push('《兒童氣喘健康護照》第 ' + c.pg + ' 頁');
    if (c.pg2) srcs.push('《白話氣喘》第 ' + c.pg2 + ' 頁');
    if (c.med) srcs.push('全國氣喘用藥許可證清單');
    h += '<div class="src">資料來源：' + esc(srcs.join('；')) + '</div>';
    h += '</article>';
    view.innerHTML = h;
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { go(g.getAttribute('data-go')); return; }
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var el = document.getElementById(cp.getAttribute('data-copy'));
      var txt = el.textContent;
      var done = function () { cp.textContent = '已複製'; setTimeout(function () { cp.textContent = '複製號碼'; }, 1600); };
      try {
        navigator.clipboard.writeText(txt).then(done, function () { selectText(el); });
      } catch (err) { selectText(el); }
    }
  });
  function selectText(el) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }


  render();
})();

</script>

</body></html>
